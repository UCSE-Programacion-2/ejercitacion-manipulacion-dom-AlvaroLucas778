# Crea issues de la actividad para repos creados desde GitHub Classroom.
# Idempotente: crea solamente los issues faltantes por titulo.
name: Setup assignment issues

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: setup-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ensure-assignment-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Crear issues faltantes de la actividad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json
          import os
          import textwrap
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          API = "https://api.github.com"
          ISSUE_LABEL = "classroom-assignment"

          ISSUES = [
              {
                  "title": "[Entrega] Vincular CSS y JS al HTML",
                  "body": """
          ## Objetivo
          Conectar la hoja de estilos y el script de JavaScript al archivo `index.html` para que la página funcione correctamente.

          ## Qué debe cumplirse
          - [ ] Dentro de `<head>`, existe una etiqueta `<link>` que vincula `css/style.css`.
          - [ ] Antes del cierre de `</body>`, existe una etiqueta `<script>` que vincula `js/script.js`.

          ## Notas
          El script debe ir al final del `<body>` para que el DOM ya esté cargado cuando se ejecute.

          ## Commit sugerido
          ```
          feat(html): vincular css y script js al html

          Closes #1
          ```""",
              },
              {
                  "title": "[Requisito] Agregar clase card a la tarjeta",
                  "body": """
          ## Objetivo
          Usar JavaScript para agregar dinámicamente la clase `card` al contenedor de la tarjeta, activando los estilos definidos en `style.css`.

          ## Qué debe cumplirse
          - [ ] En `js/script.js`, se selecciona el elemento con `id="tarjeta"` usando `getElementById`.
          - [ ] Se usa `setAttribute('class', 'card')` para agregar la clase.

          ## Referencia
          Ejercicio 1 del archivo `js/script.js`.

          ## Commit sugerido
          ```
          feat(js): agregar clase card a la tarjeta con setAttribute

          Closes #2
          ```""",
              },
              {
                  "title": "[Requisito] Asignar imagen de YouTube",
                  "body": """
          ## Objetivo
          Usar JavaScript para asignar la URL de la imagen de YouTube al atributo `src` del elemento `<img>`.

          ## Qué debe cumplirse
          - [ ] En `js/script.js`, se selecciona el elemento con `id="logo"` usando `getElementById`.
          - [ ] Se asigna el `src` con `setAttribute('src', ...)` o con la propiedad `.src = ...`.
          - [ ] La URL usada es `https://www.youtube.com/img/desktop/yt_1200.png`.

          ## Referencia
          Ejercicio 2 del archivo `js/script.js`.

          ## Commit sugerido
          ```
          feat(js): asignar imagen de youtube al logo

          Closes #3
          ```""",
              },
              {
                  "title": "[Requisito] Quitar el formato feo del título",
                  "body": """
          ## Objetivo
          Usar JavaScript para remover la clase `titulo-feo` del `<h1>`, eliminando los estilos no deseados (fondo amarillo, color rojo, tipografía serif).

          ## Qué debe cumplirse
          - [ ] En `js/script.js`, se selecciona el `<h1>` que tiene la clase `titulo-feo`.
          - [ ] Se usa `removeAttribute('class')` o `classList.remove('titulo-feo')` para quitar la clase.

          ## Referencia
          Ejercicio 3 del archivo `js/script.js`.

          ## Commit sugerido
          ```
          feat(js): quitar clase titulo-feo del h1

          Closes #4
          ```""",
              },
              {
                  "title": "[Requisito] Verificar atributo href del link YouTube",
                  "body": """
          ## Objetivo
          Usar JavaScript para verificar si el enlace a YouTube posee el atributo `href` y mostrar el resultado por consola.

          ## Qué debe cumplirse
          - [ ] En `js/script.js`, se selecciona el elemento con `id="link_youtube"` usando `getElementById`.
          - [ ] Se usa `hasAttribute('href')` para verificar la existencia del atributo.
          - [ ] Se muestra el resultado con `console.log()` (debería mostrar `true`).

          ## Referencia
          Ejercicio 4 del archivo `js/script.js`.

          ## Commit sugerido
          ```
          feat(js): verificar href del link youtube con hasAttribute

          Closes #5
          ```""",
              },
              {
                  "title": "[Requisito] Obtener href del link Wikipedia",
                  "body": """
          ## Objetivo
          Usar JavaScript para obtener el valor del atributo `href` del enlace a Wikipedia y mostrarlo por consola.

          ## Qué debe cumplirse
          - [ ] En `js/script.js`, se selecciona el elemento con `id="link_wikipedia"` usando `getElementById`.
          - [ ] Se usa `getAttribute('href')` para obtener el valor del atributo.
          - [ ] Se muestra el resultado con `console.log()` (debería mostrar `https://es.wikipedia.org/wiki/YouTube`).

          ## Referencia
          Ejercicio 5 del archivo `js/script.js`.

          ## Commit sugerido
          ```
          feat(js): obtener href del link wikipedia con getAttribute

          Closes #6
          ```""",
              },
              {
                  "title": "[Revisión docente] Resultado visual y consola",
                  "body": """
          ## Objetivo
          Completar la corrección más allá de los tests automáticos.

          ## Checklist sugerida para el docente
          - [ ] La tarjeta se ve como el **resultado esperado** (imagen visible, estilos de tarjeta aplicados, título sin formato feo).
          - [ ] En la consola del navegador aparece `true` (ejercicio 4).
          - [ ] En la consola del navegador aparece `https://es.wikipedia.org/wiki/YouTube` (ejercicio 5).
          - [ ] El código JavaScript es limpio y legible.

          ## Nota
          Los tests de GitHub Classroom **no sustituyen** esta revisión visual.

          ## Commit sugerido
          ```
          chore: entrega lista para revision docente

          Closes #7
          ```""",
              },
          ]

          for _spec in ISSUES:
              _spec["body"] = textwrap.dedent(_spec["body"]).strip()

          def request(method, url, data=None):
              headers = {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              body = None
              if data is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"
                  body = json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          def list_existing_issue_titles():
              titles = set()
              page = 1
              while True:
                  url = f"{API}/repos/{REPO}/issues?state=all&per_page=100&page={page}"
                  headers = {
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      batch = json.loads(resp.read().decode())
                  if not batch:
                      break
                  for item in batch:
                      if item.get("pull_request") is None:
                          title = item.get("title", "").strip()
                          if title:
                              titles.add(title)
                  if len(batch) < 100:
                      break
                  page += 1
              return titles

          def ensure_label_exists(label_name):
              url = f"{API}/repos/{REPO}/labels/{urllib.parse.quote(label_name)}"
              try:
                  request("GET", url)
                  return
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              request(
                  "POST",
                  f"{API}/repos/{REPO}/labels",
                  {
                      "name": label_name,
                      "color": "1d76db",
                      "description": "Issue generado automaticamente para la actividad de Classroom",
                  },
              )
              print(f"Etiqueta creada: {label_name}")

          existing_titles = list_existing_issue_titles()
          ensure_label_exists(ISSUE_LABEL)

          created_count = 0
          skipped_count = 0
          for spec in ISSUES:
              if spec["title"] in existing_titles:
                  skipped_count += 1
                  print("Ya existe, se omite: " + spec["title"])
                  continue
              url = f"{API}/repos/{REPO}/issues"
              created = request(
                  "POST",
                  url,
                  {"title": spec["title"], "body": spec["body"], "labels": [ISSUE_LABEL]},
              )
              created_count += 1
              print("Creado issue #" + str(created["number"]) + ": " + spec["title"])
          print(
              "Listo: "
              + str(created_count)
              + " issue(s) creado(s), "
              + str(skipped_count)
              + " ya existentes."
          )
          PY
